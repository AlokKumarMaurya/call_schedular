name: call_schedular
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  flutter_screenutil_plus: ^1.6.0
  get_storage: ^2.1.1
  flutter_native_contact_picker: ^0.0.12
  sqflite: ^2.4.4
  path: ^1.9.1
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  package_info_plus: ^10.2.2
  flutter_native_splash: ^2.4.8
  in_app_update: ^5.0.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0
  add_2_calendar: ^3.1.1
  file_picker: ^13.1.0
  share_plus: 13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: false

flutter_native_splash:
  color: "#ffffff"
  image: assets/icon/splash_screen.png
  color_dark: "#121212"
  image_dark: assets/icon/splash_screen.png
  fullscreen: true

  android_12:
    image: assets/icon/splash_screen.png
    color: "#ffffff"
    icon_background_color: "#ffffff"