name: Android Play Store Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: android-play-store-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, upload, and open version PR
    runs-on: ubuntu-latest
    steps:
      - name: Require the default release branch
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Run this workflow from the master branch."
          exit 1

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Increment Android build number
        id: version
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("pubspec.yaml")
          content = path.read_text()
          match = re.search(r"(?m)^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$", content)
          if not match:
              raise SystemExit("Expected pubspec.yaml version in x.y.z+build format.")

          version_name = match.group(1)
          build_number = int(match.group(2)) + 1
          version = f"{version_name}+{build_number}"
          updated = content[:match.start()] + f"version: {version}" + content[match.end():]
          path.write_text(updated)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version_name={version_name}\n")
              output.write(f"build_number={build_number}\n")
              output.write(f"version={version}\n")
          print(f"Updated pubspec.yaml version to {version}")
          PY

      - name: Create release branch and commit version bump
        id: branch
        shell: bash
        run: |
          BRANCH="release/android-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add pubspec.yaml
          git commit -m "chore(release): bump Android build to ${{ steps.version.outputs.version }}"
          git push origin "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Validate Android signing and Play Console secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PLAY_STORE_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build signed Android App Bundle
        run: flutter build appbundle --release

      - name: Save App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: callmate-release-${{ steps.version.outputs.version }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload bundle to Google Play internal testing
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.alokkumarmaurya.callmate
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Open PR with updated version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.branch.outputs.name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          gh pr create \
            --base master \
            --head "$RELEASE_BRANCH" \
            --title "chore(release): bump Android build to $RELEASE_VERSION" \
            --body "## Android release version update

          - Updated `pubspec.yaml` to version `$RELEASE_VERSION`.
          - Incremented Android build number to `$BUILD_NUMBER`.
          - Built a signed Android App Bundle and uploaded it to the Google Play **internal testing** track.
          - The workflow artifact contains the generated `.aab` file.

          Please review and merge this PR to keep the repository version aligned with the uploaded build."
